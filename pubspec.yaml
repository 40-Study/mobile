name: study
description: 40Study - Flutter app template with bloc, DI, l10n and theme.

publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.19.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.2
  dio: ^5.8.0+1
  intl: ^0.20.2
  google_fonts: 8.0.2
  #analyzer: ^2.7.0
  freezed_annotation: ^3.0.0
  intl_utils: ^2.8.10
  flutter_svg: ^2.0.17
  gap: ^3.0.1
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  file: ^7.0.0
  get_it: 9.2.1
  injectable: ^2.5.0
  nullx: ^0.1.17
  retrofit: ^4.4.2
  retrofit_generator: ^10.0.1
  talker: ^5.0.0
  talker_logger: ^5.0.0
  talker_dio_logger: ^5.0.0
  talker_bloc_logger: ^5.0.0
  animations: ^2.0.7
  rive: ^0.13.20
  yaml: ^3.1.2
  collection: ^1.18.0
  package_info_plus: ^9.0.0
  provider: ^6.1.5
  url_launcher: ^6.3.2
  flutter_dotenv: ^5.2.1

  flutter_localizations:
    sdk: flutter
  uuid: ^4.5.3
  geolocator: ^13.0.1
  video_player: ^2.11.1
  chewie: ^1.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  build_runner: ^2.4.15
  injectable_generator: ^2.9.1
  flutter_gen_runner: ^5.9.0
  json_serializable: ^6.11.2
  #coverage: ^1.1.0
  lint: ^2.8.0
  mockito: ^5.4.5
  #test: ^1.17.9
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  freezed: ^3.2.3
  #dart_code_metrics: ^5.7.5
  network_image_mock: ^2.1.1
  flutter_oss_licenses: ^3.0.4

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    - .env.dev
    - .env.qa
    - .env.prod
    - assets/images/
    - assets/icons/navigation/
    - assets/rive/
    - google_fonts/
  fonts:
    - family: Roboto
      fonts:
        - asset: google_fonts/Roboto-Medium.ttf
          weight: 500

flutter_gen:
  output: lib/generated/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  # Exclude env files to avoid duplicate variable names
  assets:
    exclude:
      - "*.env*"
      - ".env*"

  # Optional
  integrations:
    flutter_svg: true

  colors:
    inputs:
      - assets/color/colors.xml

flutter_intl:
  enabled: true
